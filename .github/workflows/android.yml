name: Android

on:
  push:
    tags: ['android-build/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z), e.g. 1.0.0'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/android-build/* ]]; then
            v="${GITHUB_REF#refs/tags/android-build/}"
          fi
          if [ -z "$v" ]; then v="0.0.0-dev"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not X.Y.Z"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v, core $(git rev-parse --short HEAD)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the core (gomobile)
        run: bash scripts/build-android-core.sh .

      # Если shared/ пустая — удалите этот шаг.
      - name: Tests
        run: ./gradlew --no-daemon :shared:jvmTest

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            [ "$PUBLISH" = true ] && { echo "::error::ANDROID_KEYSTORE_BASE64 is required to publish a release"; exit 1; }
            echo "No keystore: unsigned APKs"; exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflux-release.jks"
          chmod 600 "$RUNNER_TEMP/openflux-release.jks"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openflux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.value }} :androidApp:assembleRelease

      - name: Verify APK signatures
        if: inputs.publish
        run: |
          find androidApp/build/outputs/apk/release -name '*.apk' -print0 | \
            xargs -0 -r -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose

      - name: Collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -name '*.apk' -print -exec cp {} dist/ \;
          for apk in dist/*.apk; do mv "$apk" "dist/OpenFluxAndroid-${{ steps.version.outputs.value }}-$(basename "$apk")"; done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFluxAndroid-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          notes="APK универсальный или под архитектуру устройства. Ядро: \`$(git rev-parse --short HEAD)\`. Контрольные суммы — в \`SHA256SUMS.txt\`."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "OpenFluxAndroid $tag" --notes "$notes"
          else
            gh release create "$tag" dist/* \
              --title "OpenFluxAndroid $tag" \
              --generate-notes \
              --notes "$notes"
          fi
